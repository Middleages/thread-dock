name: Development request
description: Describe a product change for work interview and planning.
title: "[Development Request] "
labels: ["development-request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or product problem should change?
    validations:
      required: true
  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: What observable result will show success?
    validations:
      required: true
  - type: textarea
    id: excluded-scope
    attributes:
      label: Excluded scope
      description: What is explicitly outside this request?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions required to accept the work.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: Identify data, security, deployment, compatibility, or delivery risks.
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository
      description: Which owner/repository should receive this work?
      placeholder: owner/repository
    validations:
      required: true
