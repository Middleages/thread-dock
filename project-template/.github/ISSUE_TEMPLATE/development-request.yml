name: Development request
description: Describe the problem and the observable conditions for success.
title: "[Development Request] "
labels: ["development-request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or product problem should change?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What observable behavior will show success? Include important failure cases you already know.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Known constraints or exclusions (optional)
      description: Existing decisions, dependencies, compatibility, data risks or work outside scope.
  - type: textarea
    id: verification-plan
    attributes:
      label: Known checks or references (optional)
      description: Existing tests, reproduction steps, screenshots or design links. The feature owner investigates missing technical details.
